<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D9488">
        <animate attributeName="stop-color" values="#0D9488;#0891B2;#0D9488" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0891B2">
        <animate attributeName="stop-color" values="#0891B2;#14B8A6;#0891B2" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accentH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488">
        <animate attributeName="stop-color" values="#0D9488;#0891B2;#0D9488" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0891B2">
        <animate attributeName="stop-color" values="#0891B2;#14B8A6;#0891B2" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.08)"/>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.2">
        <animate attributeName="offset" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="rgba(15,23,42,0.08)"/>
    </linearGradient>

    <radialGradient id="glowL" cx="30%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0D9488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="75%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="panelShadow"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(15,23,42,0.06)"/></filter>
  </defs>

  <!-- Background -->
  <rect width="1180" height="610" fill="url(#bgGrad)" rx="16"/>
  <rect width="1180" height="610" fill="url(#glowL)" rx="16">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect width="1180" height="610" fill="url(#glowR)" rx="16">
    <animate attributeName="opacity" values="1;0.6;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanline -->
  <rect x="0" y="0" width="1180" height="2" fill="#0D9488" opacity="0.02" rx="16">
    <animate attributeName="y" values="0;610;0" dur="6s" repeatCount="indefinite"/>
  </rect>

