<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Background Radial Glow -->
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </radialGradient>
        
        <!-- Panel Linear Gradient for Border Shimmer -->
        <linearGradient id="panelShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="rgba(15,23,42,0.08)" />
            <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.3">
                <animate attributeName="offset" values="0;1;0" dur="8s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="rgba(15,23,42,0.08)" />
        </linearGradient>

        <!-- Accent Gradient -->
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#2563EB">
                <animate attributeName="stop-color" values="#2563EB;#06B6D4;#2563EB" dur="5s" repeatCount="indefinite" />
            </stop>
            <stop offset="50%" stop-color="#06B6D4">
                <animate attributeName="stop-color" values="#06B6D4;#10B981;#06B6D4" dur="5s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#10B981">
                <animate attributeName="stop-color" values="#10B981;#2563EB;#10B981" dur="5s" repeatCount="indefinite" />
            </stop>
        </linearGradient>
        
        <!-- Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <clipPath id="typingClip1">
            <rect x="0" y="0" width="0" height="30">
                <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.1;0.9;1" dur="12s" begin="0s" repeatCount="indefinite" />
            </rect>
        </clipPath>
        <clipPath id="typingClip2">
            <rect x="0" y="0" width="0" height="30">
                <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.1;0.9;1" dur="12s" begin="4s" repeatCount="indefinite" />
            </rect>
        </clipPath>
        <clipPath id="typingClip3">
            <rect x="0" y="0" width="0" height="30">
                <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.1;0.9;1" dur="12s" begin="8s" repeatCount="indefinite" />
            </rect>
        </clipPath>

    </defs>

    <!-- Background -->
    <rect width="1180" height="610" fill="#FFFFFF" rx="16" />
    <circle cx="200" cy="300" r="400" fill="url(#bgGlow)">
        <animate attributeName="cx" values="200;400;200" dur="10s" repeatCount="indefinite" />
        <animate attributeName="cy" values="300;100;300" dur="12s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="300" r="400" fill="url(#bgGlow)">
        <animate attributeName="cx" values="900;700;900" dur="15s" repeatCount="indefinite" />
        <animate attributeName="cy" values="300;500;300" dur="13s" repeatCount="indefinite" />
    </circle>

    <!-- LEFT SIDE : 38% -> width ~450 -->
    <g transform="translate(40, 40)">
        <!-- Panel bg -->
        <rect width="400" height="530" fill="#F8FAFC" rx="12" stroke="url(#panelShimmer)" stroke-width="1.5" opacity="0.9" />
        
        <!-- ASCII Art -->
        <g transform="translate(50, 100)" font-family="monospace" font-size="14" font-weight="bold" fill="url(#accentGrad)" filter="url(#glow)">
            <animateTransform attributeName="transform" type="translate" values="50,100; 50,90; 50,100" dur="6s" repeatCount="indefinite" />
            
            <text x="0" y="20">      .--------.      </text>
            <text x="0" y="40">    /          \     </text>
            <text x="0" y="60">   /   010101   \    </text>
            <text x="0" y="80">  /   10101010   \   </text>
            <text x="0" y="100"> /   0101010101   \  </text>
            <text x="0" y="120"> |   1010101010   |  </text>
            <text x="0" y="140">  \              /   </text>
            <text x="0" y="160">   \____________/    </text>
            <text x="0" y="180">      |      |       </text>
            <text x="0" y="200">      |______|       </text>
            <text x="0" y="220">   [CYBER SECURITY]  </text>
            
            <!-- Scanline -->
            <rect x="0" y="0" width="250" height="2" fill="#06B6D4" opacity="0.5">
                <animate attributeName="y" values="0; 250; 0" dur="4s" repeatCount="indefinite" />
            </rect>
        </g>
    </g>

    <!-- RIGHT SIDE : 62% -> width ~650 -->
    <g transform="translate(480, 40)">
        <rect width="660" height="530" fill="#F8FAFC" rx="12" stroke="url(#panelShimmer)" stroke-width="1.5" opacity="0.9" />
        
        <!-- Terminal Header -->
        <g transform="translate(20, 20)">
            <circle cx="10" cy="10" r="6" fill="#EF4444" />
            <circle cx="30" cy="10" r="6" fill="#F59E0B" />
            <circle cx="50" cy="10" r="6" fill="#10B981" />
            <text x="330" y="14" fill="#475569" font-family="monospace" font-size="12" text-anchor="middle">~ /oumnih /profile</text>
            <line x1="0" y1="30" x2="620" y2="30" stroke="rgba(15,23,42,0.08)" stroke-width="1" />
        </g>

        <!-- Content -->
        <g transform="translate(40, 80)" font-family="sans-serif">
            <!-- Greeting -->
            <text x="0" y="0" fill="#0F172A" font-size="32" font-weight="bold">Hi 👋 I'm Oumnih Abdelkafi</text>
            
            <!-- Animated Typing Text -->
            <g transform="translate(0, 40)" font-size="20" font-weight="bold" fill="url(#accentGrad)">
                <text x="0" y="0" opacity="0">
                    &gt; Cybersecurity Student
                    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.33;0.34;1" dur="12s" begin="0s" repeatCount="indefinite" />
                </text>
                <text x="0" y="0" opacity="0">
                    &gt; Offensive Security Enthusiast
                    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.34;0.66;0.67;1" dur="12s" begin="0s" repeatCount="indefinite" />
                </text>
                <text x="0" y="0" opacity="0">
                    &gt; System Administrator
                    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.66;0.67;1" dur="12s" begin="0s" repeatCount="indefinite" />
                </text>
                
                <!-- Blinking Cursor -->
                <rect x="330" y="-15" width="2" height="20" fill="#06B6D4">
                    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
                </rect>
            </g>

            <!-- Details: Sequential Reveal -->
            <g transform="translate(0, 90)" font-size="16" fill="#475569" font-family="monospace">
                <text x="0" y="0" opacity="0">
                    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="10s" fill="freeze" />
                    <tspan fill="#0F172A" font-weight="bold">Location:</tspan> Nador, Morocco
                </text>
                <text x="0" y="30" opacity="0">
                    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2;1" dur="10s" fill="freeze" />
                    <tspan fill="#0F172A" font-weight="bold">Education:</tspan> ENSAO (Cycle d'Ingénieur)
                </text>
                <text x="0" y="60" opacity="0">
                    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.3;1" dur="10s" fill="freeze" />
                    <tspan fill="#0F172A" font-weight="bold">Focus:</tspan> Offensive Security &amp; Home Labs
                </text>
                <text x="0" y="90" opacity="0">
                    <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.4;1" dur="10s" fill="freeze" />
                    <tspan fill="#0F172A" font-weight="bold">Email:</tspan> oumnihabdelkafi0@gmail.com
                </text>
            </g>
            
            <!-- Skills Pills -->
            <g transform="translate(0, 230)">
                <text x="0" y="0" fill="#0F172A" font-size="18" font-weight="bold">Technologies &amp; Tools</text>
                
                <!-- Row 1 -->
                <g transform="translate(0, 20)">

                    <g transform="translate(0, 0)">
                        <rect width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" stroke-width="1">
                            <animate attributeName="stroke" values="rgba(15,23,42,0.08);#06B6D4;rgba(15,23,42,0.08)" dur="4.0s" repeatCount="indefinite" />
                        </rect>
                        <text x="50" y="20" font-size="14" fill="#475569" text-anchor="middle">Linux</text>
                    </g>

                    <g transform="translate(110, 0)">
                        <rect width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" stroke-width="1">
                            <animate attributeName="stroke" values="rgba(15,23,42,0.08);#06B6D4;rgba(15,23,42,0.08)" dur="4.5s" repeatCount="indefinite" />
                        </rect>
                        <text x="50" y="20" font-size="14" fill="#475569" text-anchor="middle">Bash</text>
                    </g>

                    <g transform="translate(220, 0)">
                        <rect width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" stroke-width="1">
                            <animate attributeName="stroke" values="rgba(15,23,42,0.08);#06B6D4;rgba(15,23,42,0.08)" dur="5.0s" repeatCount="indefinite" />
                        </rect>
                        <text x="50" y="20" font-size="14" fill="#475569" text-anchor="middle">Node.js</text>
                    </g>

                    <g transform="translate(330, 0)">
                        <rect width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" stroke-width="1">
                            <animate attributeName="stroke" values="rgba(15,23,42,0.08);#06B6D4;rgba(15,23,42,0.08)" dur="5.5s" repeatCount="indefinite" />
                        </rect>
                        <text x="50" y="20" font-size="14" fill="#475569" text-anchor="middle">Express</text>
                    </g>

                    <g transform="translate(440, 0)">
                        <rect width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" stroke-width="1">
                            <animate attributeName="stroke" values="rgba(15,23,42,0.08);#06B6D4;rgba(15,23,42,0.08)" dur="6.0s" repeatCount="indefinite" />
                        </rect>
                        <text x="50" y="20" font-size="14" fill="#475569" text-anchor="middle">Systemd</text>
                    </g>

                    <g transform="translate(0, 40)">
                        <rect width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" stroke-width="1">
                            <animate attributeName="stroke" values="rgba(15,23,42,0.08);#06B6D4;rgba(15,23,42,0.08)" dur="6.5s" repeatCount="indefinite" />
                        </rect>
                        <text x="50" y="20" font-size="14" fill="#475569" text-anchor="middle">GitHub</text>
                    </g>

                    <g transform="translate(110, 40)">
                        <rect width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" stroke-width="1">
                            <animate attributeName="stroke" values="rgba(15,23,42,0.08);#06B6D4;rgba(15,23,42,0.08)" dur="7.0s" repeatCount="indefinite" />
                        </rect>
                        <text x="50" y="20" font-size="14" fill="#475569" text-anchor="middle">CTFs</text>
                    </g>

                    <g transform="translate(220, 40)">
                        <rect width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" stroke-width="1">
                            <animate attributeName="stroke" values="rgba(15,23,42,0.08);#06B6D4;rgba(15,23,42,0.08)" dur="7.5s" repeatCount="indefinite" />
                        </rect>
                        <text x="50" y="20" font-size="14" fill="#475569" text-anchor="middle">Python</text>
                    </g>

                    <g transform="translate(330, 40)">
                        <rect width="100" height="30" rx="15" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" stroke-width="1">
                            <animate attributeName="stroke" values="rgba(15,23,42,0.08);#06B6D4;rgba(15,23,42,0.08)" dur="8.0s" repeatCount="indefinite" />
                        </rect>
                        <text x="50" y="20" font-size="14" fill="#475569" text-anchor="middle">Networking</text>
                    </g>

                </g>
            </g>

            <!-- Social Links (Bottom Right) -->
            <g transform="translate(0, 350)" fill="#475569">
                <circle cx="20" cy="20" r="16" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" />
                <text x="20" y="25" text-anchor="middle" font-size="14">GH</text>
                
                <circle cx="60" cy="20" r="16" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" />
                <text x="60" y="25" text-anchor="middle" font-size="14">IN</text>
                
                <circle cx="100" cy="20" r="16" fill="#FFFFFF" stroke="rgba(15,23,42,0.08)" />
                <text x="100" y="25" text-anchor="middle" font-size="14">X</text>
            </g>

        </g>
    </g>
</svg>