<svg width="900" height="260" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.15)"/>
      <stop offset="35%" stop-color="rgba(21, 128, 61, 0.3)"/>
      <stop offset="70%" stop-color="rgba(29, 78, 216, 0.3)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.12)"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseGlowLight {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .pulsing-dot-light {
      animation: pulseGlowLight 2.5s ease-in-out infinite;
    }
    .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="898" height="258" rx="12" fill="url(#bgGLight)" stroke="url(#borderGradLight)" stroke-width="1.2"/>
  <rect x="7" y="7" width="886" height="246" rx="8" fill="#FFFFFF" stroke="rgba(15, 23, 42, 0.06)" stroke-width="1"/>

  <!-- Blueprint Grid Pattern -->
  <g opacity="0.05" stroke="#0F172A" stroke-width="0.8">
    <line x1="30" y1="8" x2="30" y2="252" />
    <line x1="300" y1="8" x2="300" y2="252" />
    <line x1="600" y1="8" x2="600" y2="252" />
    <line x1="870" y1="8" x2="870" y2="252" />
    <line x1="8" y1="56" x2="892" y2="56" />
    <line x1="8" y1="196" x2="892" y2="196" />
  </g>

  <!-- TOP STATUS / TELEMETRY HUD BAR -->
  <g transform="translate(24, 22)">
    <!-- Active Status Pill -->
    <rect x="0" y="0" width="186" height="24" rx="12" fill="#F1F5F9" stroke="rgba(21, 128, 61, 0.35)" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#16A34A" class="pulsing-dot-light"/>
    <text x="24" y="15.5" fill="#0F172A" class="mono" font-size="9.5" font-weight="600" letter-spacing="0.5">DISPATCH: ACTIVE // SOC</text>

    <!-- Center System Specs -->
    <text x="210" y="15" fill="#64748B" class="mono" font-size="10">NODE: <tspan fill="#0F172A" font-weight="600">ENSAO-CYBERSEC-2029</tspan></text>
    <text x="440" y="15" fill="#64748B" class="mono" font-size="10">ENV: <tspan fill="#0F172A" font-weight="600">LINUX 6.8+ (DEBIAN / ZORIN)</tspan></text>

    <!-- Right Target -->
    <rect x="702" y="0" width="150" height="24" rx="4" fill="#F1F5F9" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
    <text x="777" y="15.5" fill="#475569" text-anchor="middle" class="mono" font-size="9.5" font-weight="500">OUJDA, MOROCCO</text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="62" x2="876" y2="62" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>

  <!-- MAIN IDENTITY & SPECIFICATION -->
  <g transform="translate(26, 80)">
    <!-- Sub-heading eyebrow tag -->
    <text x="0" y="18" fill="#15803D" class="mono" font-size="11" font-weight="600" letter-spacing="1.8">CYBERSECURITY ENGINEERING &amp; SYSTEMS ARCHITECTURE</text>
    
    <!-- Massive Title -->
    <text x="0" y="58" fill="#0F172A" class="sans" font-size="34" font-weight="700" letter-spacing="-0.8">Oumnih Abdelkafi</text>
    <text x="315" y="56" fill="#94A3B8" class="mono" font-size="13">[@abdelkafi007 // leviathan]</text>

    <!-- Architectural Role / Sub-title -->
    <text x="0" y="86" fill="#475569" class="sans" font-size="13.5" font-weight="400">
      First-year engineering student at <tspan fill="#0F172A" font-weight="600">ENSAO</tspan> · Pursuing State Engineering Degree in Cybersecurity &amp; Distributed Systems ('29)
    </text>
    <text x="0" y="106" fill="#64748B" class="sans" font-size="13">
      Building threat detection engines, low-level Linux container runtimes in C, and resilient infrastructure.
    </text>
  </g>

  <!-- BOTTOM HARDWARE TELEMETRY SPECIFICATIONS -->
  <g transform="translate(24, 206)">
    <!-- Spec Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="186" height="32" rx="6" fill="#F8FAFC" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
      <circle cx="14" cy="16" r="3" fill="#16A34A"/>
      <text x="26" y="15" fill="#0F172A" class="mono" font-size="10.5" font-weight="600">SentinelSOC</text>
      <text x="26" y="26" fill="#64748B" class="mono" font-size="8.5">Event Normalization</text>
    </g>

    <!-- Spec Pill 2 -->
    <g transform="translate(196, 0)">
      <rect width="186" height="32" rx="6" fill="#F8FAFC" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
      <circle cx="14" cy="16" r="3" fill="#2563EB"/>
      <text x="26" y="15" fill="#0F172A" class="mono" font-size="10.5" font-weight="600">Microjail</text>
      <text x="26" y="26" fill="#64748B" class="mono" font-size="8.5">C Runtime / seccomp-BPF</text>
    </g>

    <!-- Spec Pill 3 -->
    <g transform="translate(392, 0)">
      <rect width="186" height="32" rx="6" fill="#F8FAFC" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
      <circle cx="14" cy="16" r="3" fill="#DC2626"/>
      <text x="26" y="15" fill="#0F172A" class="mono" font-size="10.5" font-weight="600">SSH Honeypot</text>
      <text x="26" y="26" fill="#64748B" class="mono" font-size="8.5">Cowrie / HASSH Telemetry</text>
    </g>

    <!-- Spec Pill 4 -->
    <g transform="translate(588, 0)">
      <rect width="264" height="32" rx="6" fill="#F8FAFC" stroke="rgba(15, 23, 42, 0.08)" stroke-width="1"/>
      <circle cx="14" cy="16" r="3" fill="#0891B2"/>
      <text x="26" y="15" fill="#0F172A" class="mono" font-size="10.5" font-weight="600">OverTheWire: Bandit</text>
      <text x="26" y="26" fill="#64748B" class="mono" font-size="8.5">34 / 34 Levels (100% Solved)</text>
    </g>
  </g>
</svg>