      <rect x="0" y="8" width="185" height="6" rx="3" fill="rgba(15,23,42,0.04)"/>
      <rect x="0" y="8" width="0" height="6" rx="3" fill="#F59E0B" opacity="0.8">
        <animate attributeName="width" values="0;138" dur="1s" begin="0.45s" fill="freeze"/>
      </rect>
      <rect x="0" y="8" width="0" height="6" rx="3" fill="#F59E0B" opacity="0.3" filter="url(#glow2)">
