<svg width="850" height="380" viewBox="0 0 850 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626">
        <animate attributeName="stop-color" values="#DC2626;#F59E0B;#DC2626" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#9F1239;#F59E0B" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="bShim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15,23,42,0.08)"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.15">
        <animate attributeName="offset" values="0;1;0" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="rgba(15,23,42,0.08)"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="ds"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="rgba(15,23,42,0.05)"/></filter>
  </defs>

  <!-- BG -->
  <rect width="850" height="380" fill="url(#bgG)" rx="14"/>
  <rect x="0" y="0" width="850" height="2" fill="#DC2626" opacity="0.015" rx="14">
    <animate attributeName="y" values="0;380;0" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- ═══ RADAR PANEL (Left) ═══ -->
  <g transform="translate(16,16)">
    <rect width="250" height="348" fill="#FFFFFF" rx="12" stroke="url(#bShim)" stroke-width="1" opacity="0.95" filter="url(#ds)"/>

    <!-- Header -->
    <text x="125" y="28" text-anchor="middle" fill="#0F172A" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" letter-spacing="2">THREAT RADAR</text>
    <line x1="16" y1="38" x2="234" y2="38" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>

    <!-- Radar -->
    <g transform="translate(125,190)">
      <!-- Concentric rings -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#DC2626" stroke-width="0.5" opacity="0.15"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#DC2626" stroke-width="0.5" opacity="0.2"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#DC2626" stroke-width="0.5" opacity="0.25"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#DC2626" stroke-width="0.5" opacity="0.3"/>

      <!-- Cross lines -->
      <line x1="-110" y1="0" x2="110" y2="0" stroke="#DC2626" stroke-width="0.3" opacity="0.15"/>
      <line x1="0" y1="-110" x2="0" y2="110" stroke="#DC2626" stroke-width="0.3" opacity="0.15"/>

      <!-- Radar sweep -->
      <g opacity="0.6">
        <line x1="0" y1="0" x2="0" y2="-110" stroke="#DC2626" stroke-width="2" filter="url(#glow2)">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- Sweep trail (cone) -->
      <path d="M0,0 L0,-110 A110,110 0 0,1 77.78,-77.78 Z" fill="#DC2626" opacity="0.05">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </path>

      <!-- Blips -->
      <circle cx="35" cy="-60" r="3" fill="#DC2626" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-50" cy="30" r="3" fill="#F59E0B" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="70" cy="20" r="3" fill="#DC2626" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="4s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-20" cy="-80" r="3" fill="#EF4444" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="4s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="55" cy="-35" r="2.5" fill="#F59E0B" opacity="0">
        <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Center dot -->
      <circle cx="0" cy="0" r="3" fill="#DC2626">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Status -->
    <g transform="translate(16,316)">
      <circle cx="6" cy="6" r="4" fill="#DC2626">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="16" y="10" fill="#DC2626" font-family="monospace" font-size="10" font-weight="600">SCANNING ACTIVE</text>
    </g>
  </g>

