      <text x="0" y="0" opacity="0">
        <tspan fill="#DC2626">[OK]</tspan><tspan fill="#64748B"> SSH lab deployed</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/>
