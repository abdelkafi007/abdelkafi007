    <text x="130" y="28" text-anchor="middle" fill="#0F172A" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="700" letter-spacing="2">OPERATIONS LOG</text>
    <line x1="16" y1="38" x2="244" y2="38" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>

    <!-- Log entries -->
