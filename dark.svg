<svg width="1180" height="610" viewBox="0 0 1180 610" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0a0f1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Accent: Deep Emerald → Cyan -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#06B6D4;#10B981" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#34D399;#06B6D4" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Panel border shimmer -->
    <linearGradient id="borderShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.25">
        <animate attributeName="offset" values="0;1;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Radial ambient glow -->
    <radialGradient id="ambientLeft" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientRight" cx="75%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Circle clip for avatar -->
    <clipPath id="avatarClip">
      <circle cx="200" cy="265" r="110"/>
    </clipPath>

    <!-- Avatar ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#06B6D4;#10B981" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#34D399;#06B6D4" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- BG -->
  <rect width="1180" height="610" fill="url(#bgGrad)" rx="16"/>

  <!-- Ambient glows -->
  <rect width="1180" height="610" fill="url(#ambientLeft)" rx="16">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect width="1180" height="610" fill="url(#ambientRight)" rx="16">
    <animate attributeName="opacity" values="1;0.7;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Scanline overlay -->
  <rect x="0" y="0" width="1180" height="3" fill="#10B981" opacity="0.04" rx="16">
    <animate attributeName="y" values="0;610;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- ====== LEFT PANEL: Avatar + Identity ====== -->
  <g transform="translate(40, 40)">
    <rect width="360" height="530" fill="#0F172A" rx="14" stroke="url(#borderShimmer)" stroke-width="1" opacity="0.92"/>

    <!-- Avatar with animated ring -->
    <circle cx="200" cy="265" r="116" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.8" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0 200 265" to="360 200 265" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="265" r="112" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="360 200 265" to="0 200 265" dur="15s" repeatCount="indefinite"/>
    </circle>
    <image href="https://avatars.githubusercontent.com/u/149261567?v=4" x="88" y="153" width="224" height="224" clip-path="url(#avatarClip)"/>

    <!-- Name under avatar -->
    <text x="200" y="420" text-anchor="middle" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700">Oumnih Abdelkafi</text>
    <text x="200" y="448" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="13">@abdelkafi007</text>

    <!-- Status indicator -->
    <circle cx="165" cy="482" r="5" fill="#10B981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="178" y="486" fill="#94A3B8" font-family="monospace" font-size="12">Open to internships</text>
  </g>

  <!-- ====== RIGHT PANEL: Terminal ====== -->
  <g transform="translate(430, 40)">
    <rect width="710" height="530" fill="#0F172A" rx="14" stroke="url(#borderShimmer)" stroke-width="1" opacity="0.92"/>

    <!-- Terminal chrome -->
    <g transform="translate(24, 20)">
      <circle cx="8" cy="8" r="5" fill="#EF4444" opacity="0.8"/>
      <circle cx="26" cy="8" r="5" fill="#F59E0B" opacity="0.8"/>
      <circle cx="44" cy="8" r="5" fill="#10B981" opacity="0.8"/>
      <text x="340" y="12" fill="#475569" font-family="monospace" font-size="11" text-anchor="middle">oumnih@ensao ~ /whoami</text>
      <line x1="0" y1="26" x2="662" y2="26" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </g>

    <!-- Greeting -->
    <g transform="translate(40, 76)">
      <text x="0" y="0" fill="url(#accent)" font-family="'Segoe UI', sans-serif" font-size="30" font-weight="800" filter="url(#glow)">
        Hey, I'm Oumnih Abdelkafi
      </text>

      <!-- Typing roles -->
      <g transform="translate(0, 38)">
        <text x="0" y="0" fill="#10B981" font-family="monospace" font-size="17" font-weight="600" opacity="0">
          &gt; Cybersecurity Student @ ENSAO
          <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.01;0.02;0.32;0.33;0.34;0.66;0.67;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="0" fill="#06B6D4" font-family="monospace" font-size="17" font-weight="600" opacity="0">
          &gt; Offensive Security Enthusiast
          <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.32;0.33;0.34;0.35;0.65;0.66;0.67;1" dur="9s" repeatCount="indefinite"/>
        </text>
        <text x="0" y="0" fill="#34D399" font-family="monospace" font-size="17" font-weight="600" opacity="0">
          &gt; Building Secure Infrastructure
          <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.32;0.33;0.65;0.66;0.67;0.68;0.98;1" dur="9s" repeatCount="indefinite"/>
        </text>

        <!-- Blinking cursor -->
        <rect x="370" y="-14" width="2" height="18" fill="#10B981">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Info section -->
    <g transform="translate(40, 160)" font-family="monospace" font-size="14">
      <text x="0" y="0" opacity="0">
        <tspan fill="#10B981" font-weight="bold">location</tspan><tspan fill="#475569"> ........... </tspan><tspan fill="#CBD5E1">Nador, Morocco</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
      </text>
      <text x="0" y="28" opacity="0">
        <tspan fill="#10B981" font-weight="bold">education</tspan><tspan fill="#475569"> .......... </tspan><tspan fill="#CBD5E1">ENSAO, Cycle d'Ingenieur (2029)</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.8s" fill="freeze"/>
      </text>
      <text x="0" y="56" opacity="0">
        <tspan fill="#10B981" font-weight="bold">focus</tspan><tspan fill="#475569"> .............. </tspan><tspan fill="#CBD5E1">Offensive Security, Threat Detection</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.1s" fill="freeze"/>
      </text>
      <text x="0" y="84" opacity="0">
        <tspan fill="#10B981" font-weight="bold">rank</tspan><tspan fill="#475569"> ............... </tspan><tspan fill="#CBD5E1">46/390 (Year 1) | 90/350 (Year 2)</tspan>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.4s" fill="freeze"/>
      </text>
    </g>

    <!-- Divider -->
    <line x1="40" y1="290" x2="690" y2="290" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Skills section -->
    <g transform="translate(40, 310)">
      <text x="0" y="0" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Tech Stack</text>

      <!-- Row 1 -->
      <g transform="translate(0, 22)">
        <rect x="0" y="0" width="72" height="28" rx="14" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
        </rect>
        <text x="36" y="19" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12">Linux</text>

        <rect x="82" y="0" width="66" height="28" rx="14" fill="rgba(6,182,212,0.1)" stroke="#06B6D4" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite"/>
        </rect>
        <text x="115" y="19" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12">Bash</text>

        <rect x="158" y="0" width="84" height="28" rx="14" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
        </rect>
        <text x="200" y="19" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12">Node.js</text>

        <rect x="252" y="0" width="90" height="28" rx="14" fill="rgba(6,182,212,0.1)" stroke="#06B6D4" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite"/>
        </rect>
        <text x="297" y="19" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12">Express</text>

        <rect x="352" y="0" width="88" height="28" rx="14" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4.2s" repeatCount="indefinite"/>
        </rect>
        <text x="396" y="19" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12">Systemd</text>

        <rect x="450" y="0" width="78" height="28" rx="14" fill="rgba(6,182,212,0.1)" stroke="#06B6D4" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
        </rect>
        <text x="489" y="19" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12">GitHub</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 60)">
        <rect x="0" y="0" width="66" height="28" rx="14" fill="rgba(6,182,212,0.1)" stroke="#06B6D4" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/>
        </rect>
        <text x="33" y="19" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12">SSH</text>

        <rect x="76" y="0" width="78" height="28" rx="14" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.6s" repeatCount="indefinite"/>
        </rect>
        <text x="115" y="19" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12">Python</text>

        <rect x="164" y="0" width="100" height="28" rx="14" fill="rgba(6,182,212,0.1)" stroke="#06B6D4" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4.1s" repeatCount="indefinite"/>
        </rect>
        <text x="214" y="19" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12">Networking</text>

        <rect x="274" y="0" width="60" height="28" rx="14" fill="rgba(16,185,129,0.1)" stroke="#10B981" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.9s" repeatCount="indefinite"/>
        </rect>
        <text x="304" y="19" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="12">CTFs</text>

        <rect x="344" y="0" width="72" height="28" rx="14" fill="rgba(6,182,212,0.1)" stroke="#06B6D4" stroke-width="1" opacity="0.8">
          <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4.3s" repeatCount="indefinite"/>
        </rect>
        <text x="380" y="19" text-anchor="middle" fill="#22D3EE" font-family="monospace" font-size="12">RCON</text>
      </g>
    </g>

    <!-- Divider -->
    <line x1="40" y1="430" x2="690" y2="430" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Projects -->
    <g transform="translate(40, 448)" font-family="monospace" font-size="13">
      <text x="0" y="0" fill="#F8FAFC" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700">Projects</text>

      <text x="0" y="28" fill="#475569">
        <tspan fill="#10B981">01</tspan>  <tspan fill="#CBD5E1">Minecraft Server Security Dashboard</tspan><tspan fill="#475569"> — zero-trust auth, RCON, systemd</tspan>
      </text>
      <text x="0" y="50" fill="#475569">
        <tspan fill="#10B981">02</tspan>  <tspan fill="#CBD5E1">SSH Brute Force Detection Lab</tspan><tspan fill="#475569"> — log parsing, threat detection</tspan>
      </text>
      <text x="0" y="72" fill="#475569">
        <tspan fill="#10B981">03</tspan>  <tspan fill="#CBD5E1">OverTheWire Bandit (12-20)</tspan><tspan fill="#475569"> — privilege escalation, crypto</tspan>
      </text>
    </g>
  </g>
</svg>