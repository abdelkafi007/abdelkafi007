<svg width="850" height="380" viewBox="0 0 850 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Obsidian Charcoal (Portfolio Theme #0B0C0E) -->
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="50%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </linearGradient>

    <!-- Subtle Shimmer Border -->
    <linearGradient id="bShim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(237, 235, 230, 0.08)"/>
      <stop offset="50%" stop-color="rgba(31, 157, 107, 0.3)"/>
      <stop offset="100%" stop-color="rgba(237, 235, 230, 0.08)"/>
    </linearGradient>

    <!-- Radar Sweep Glow -->
    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .pulsing { animation: pulse 2s ease-in-out infinite; }
  </style>

  <!-- Outer Card Frame (Portfolio Obsidian) -->
  <rect width="850" height="380" fill="url(#bgG)" rx="12" stroke="rgba(237, 235, 230, 0.12)" stroke-width="1"/>
  
  <!-- Subtle Top Line Accent -->
  <rect x="0" y="0" width="850" height="2" fill="#1F9D6B" opacity="0.45" rx="12"/>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- 1. THREAT RADAR PANEL (Left)                            -->
  <!-- ════════════════════════════════════════════════════════ -->
  <g transform="translate(16,16)">
    <!-- Panel Background (Surface #131418) -->
    <rect width="250" height="348" fill="#131418" rx="10" stroke="rgba(237, 235, 230, 0.08)" stroke-width="1"/>

    <!-- Header -->
    <text x="125" y="27" text-anchor="middle" fill="#EDEBE6" class="sans" font-size="12" font-weight="700" letter-spacing="2">THREAT RADAR</text>
    <line x1="16" y1="36" x2="234" y2="36" stroke="rgba(237, 235, 230, 0.08)" stroke-width="1"/>

    <!-- Radar Body -->
    <g transform="translate(125,188)">
      <!-- Concentric Grid Rings -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#1F9D6B" stroke-width="0.5" opacity="0.14"/>
      <circle cx="0" cy="0" r="82" fill="none" stroke="#1F9D6B" stroke-width="0.5" opacity="0.2"/>
      <circle cx="0" cy="0" r="54" fill="none" stroke="#1F9D6B" stroke-width="0.5" opacity="0.25"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#1F9D6B" stroke-width="0.5" opacity="0.3"/>

      <!-- Crosshairs with end ticks -->
      <line x1="-110" y1="0" x2="110" y2="0" stroke="#1F9D6B" stroke-width="0.4" opacity="0.22"/>
      <line x1="0" y1="-110" x2="0" y2="110" stroke="#1F9D6B" stroke-width="0.4" opacity="0.22"/>

      <!-- Sweep Cone Trail -->
      <path d="M0,0 L0,-110 A110,110 0 0,1 77.78,-77.78 Z" fill="#1F9D6B" opacity="0.07">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
      </path>

      <!-- Sweep Line -->
      <g opacity="0.85">
        <line x1="0" y1="0" x2="0" y2="-110" stroke="#1F9D6B" stroke-width="1.8" filter="url(#glowG)">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="4s" repeatCount="indefinite"/>
        </line>
      </g>

      <!-- Target Blips -->
      <circle cx="36" cy="-56" r="3" fill="#1F9D6B">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-50" cy="26" r="2.8" fill="#F59E0B">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="66" cy="20" r="3" fill="#C3352B">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-20" cy="-76" r="2.8" fill="#1F9D6B">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="-30" r="2.5" fill="#F59E0B">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>

      <!-- Center Node -->
      <circle cx="0" cy="0" r="3.2" fill="#1F9D6B" class="pulsing"/>
    </g>

    <!-- Status Bottom -->
    <g transform="translate(16,316)">
      <circle cx="5" cy="5" r="3.5" fill="#1F9D6B" class="pulsing"/>
      <text x="16" y="9" fill="#1F9D6B" class="mono" font-size="10" font-weight="600" letter-spacing="0.5">SCANNING ACTIVE</text>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- 2. SKILL METRICS PANEL (Center)                         -->
  <!-- ════════════════════════════════════════════════════════ -->
  <g transform="translate(280,16)">
    <!-- Panel Background (Surface #131418) -->
    <rect width="280" height="348" fill="#131418" rx="10" stroke="rgba(237, 235, 230, 0.08)" stroke-width="1"/>

    <!-- Header -->
    <text x="140" y="27" text-anchor="middle" fill="#EDEBE6" class="sans" font-size="12" font-weight="700" letter-spacing="2">SKILL METRICS</text>
    <line x1="16" y1="36" x2="264" y2="36" stroke="rgba(237, 235, 230, 0.08)" stroke-width="1"/>

    <!-- 1. Linux / CLI -->
    <g transform="translate(20,56)">
      <text x="0" y="0" fill="#8C8E93" class="mono" font-size="11.5">Linux / CLI</text>
      <text x="238" y="0" fill="#EDEBE6" class="mono" font-size="11.5" font-weight="500" text-anchor="end">88%</text>
      <rect x="0" y="7" width="186" height="5" rx="2.5" fill="#1F2023"/>
      <rect x="0" y="7" width="164" height="5" rx="2.5" fill="#1F9D6B">
        <animate attributeName="width" from="0" to="164" dur="1s" begin="0.2s" fill="freeze"/>
      </rect>
    </g>

    <!-- 2. Bash Scripting -->
    <g transform="translate(20,94)">
      <text x="0" y="0" fill="#8C8E93" class="mono" font-size="11.5">Bash Scripting</text>
      <text x="238" y="0" fill="#EDEBE6" class="mono" font-size="11.5" font-weight="500" text-anchor="end">75%</text>
      <rect x="0" y="7" width="186" height="5" rx="2.5" fill="#1F2023"/>
      <rect x="0" y="7" width="140" height="5" rx="2.5" fill="#F59E0B">
        <animate attributeName="width" from="0" to="140" dur="1s" begin="0.35s" fill="freeze"/>
      </rect>
    </g>

    <!-- 3. Network Security -->
    <g transform="translate(20,132)">
      <text x="0" y="0" fill="#8C8E93" class="mono" font-size="11.5">Network Security</text>
      <text x="238" y="0" fill="#EDEBE6" class="mono" font-size="11.5" font-weight="500" text-anchor="end">65%</text>
      <rect x="0" y="7" width="186" height="5" rx="2.5" fill="#1F2023"/>
      <rect x="0" y="7" width="121" height="5" rx="2.5" fill="#C3352B">
        <animate attributeName="width" from="0" to="121" dur="1s" begin="0.5s" fill="freeze"/>
      </rect>
    </g>

    <!-- 4. Threat Detection -->
    <g transform="translate(20,170)">
      <text x="0" y="0" fill="#8C8E93" class="mono" font-size="11.5">Threat Detection</text>
      <text x="238" y="0" fill="#EDEBE6" class="mono" font-size="11.5" font-weight="500" text-anchor="end">78%</text>
      <rect x="0" y="7" width="186" height="5" rx="2.5" fill="#1F2023"/>
      <rect x="0" y="7" width="145" height="5" rx="2.5" fill="#C3352B">
        <animate attributeName="width" from="0" to="145" dur="1s" begin="0.65s" fill="freeze"/>
      </rect>
    </g>

    <!-- 5. System Admin -->
    <g transform="translate(20,208)">
      <text x="0" y="0" fill="#8C8E93" class="mono" font-size="11.5">System Admin</text>
      <text x="238" y="0" fill="#EDEBE6" class="mono" font-size="11.5" font-weight="500" text-anchor="end">72%</text>
      <rect x="0" y="7" width="186" height="5" rx="2.5" fill="#1F2023"/>
      <rect x="0" y="7" width="134" height="5" rx="2.5" fill="#F59E0B">
        <animate attributeName="width" from="0" to="134" dur="1s" begin="0.8s" fill="freeze"/>
      </rect>
    </g>

    <!-- 6. Node.js / Express -->
    <g transform="translate(20,246)">
      <text x="0" y="0" fill="#8C8E93" class="mono" font-size="11.5">Node.js / Express</text>
      <text x="238" y="0" fill="#EDEBE6" class="mono" font-size="11.5" font-weight="500" text-anchor="end">68%</text>
      <rect x="0" y="7" width="186" height="5" rx="2.5" fill="#1F2023"/>
      <rect x="0" y="7" width="126" height="5" rx="2.5" fill="#2F6FE0">
        <animate attributeName="width" from="0" to="126" dur="1s" begin="0.95s" fill="freeze"/>
      </rect>
    </g>

    <!-- 7. CTF / Wargames -->
    <g transform="translate(20,284)">
      <text x="0" y="0" fill="#8C8E93" class="mono" font-size="11.5">CTF / Wargames</text>
      <text x="238" y="0" fill="#EDEBE6" class="mono" font-size="11.5" font-weight="500" text-anchor="end">68%</text>
      <rect x="0" y="7" width="186" height="5" rx="2.5" fill="#1F2023"/>
      <rect x="0" y="7" width="126" height="5" rx="2.5" fill="#1F9D6B">
        <animate attributeName="width" from="0" to="126" dur="1s" begin="1.1s" fill="freeze"/>
      </rect>
    </g>

    <!-- 8. Cryptography -->
    <g transform="translate(20,322)">
      <text x="0" y="0" fill="#8C8E93" class="mono" font-size="11.5">Cryptography</text>
      <text x="238" y="0" fill="#EDEBE6" class="mono" font-size="11.5" font-weight="500" text-anchor="end">45%</text>
      <rect x="0" y="7" width="186" height="5" rx="2.5" fill="#1F2023"/>
      <rect x="0" y="7" width="84" height="5" rx="2.5" fill="#F59E0B">
        <animate attributeName="width" from="0" to="84" dur="1s" begin="1.25s" fill="freeze"/>
      </rect>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════ -->
  <!-- 3. OPERATIONS LOG PANEL (Right)                         -->
  <!-- ════════════════════════════════════════════════════════ -->
  <g transform="translate(574,16)">
    <!-- Panel Background (Surface #131418) -->
    <rect width="260" height="348" fill="#131418" rx="10" stroke="rgba(237, 235, 230, 0.08)" stroke-width="1"/>

    <!-- Header -->
    <text x="130" y="27" text-anchor="middle" fill="#EDEBE6" class="sans" font-size="12" font-weight="700" letter-spacing="2">OPERATIONS LOG</text>
    <line x1="16" y1="36" x2="244" y2="36" stroke="rgba(237, 235, 230, 0.08)" stroke-width="1"/>

    <!-- Log Entries with non-breaking space between indicator and message -->
    <g transform="translate(16,56)" class="mono" font-size="10.5" xml:space="preserve">
      <text x="0" y="0" opacity="1">
        <tspan fill="#1F9D6B" font-weight="600">[OK]</tspan><tspan fill="#8C8E93">&#160; SSH lab deployed</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.3s" fill="freeze"/>
      </text>
      <text x="0" y="23" opacity="1">
        <tspan fill="#1F9D6B" font-weight="600">[OK]</tspan><tspan fill="#8C8E93">&#160; auth.log parser active</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.6s" fill="freeze"/>
      </text>
      <text x="0" y="46" opacity="1">
        <tspan fill="#F59E0B" font-weight="600">[WRN]</tspan><tspan fill="#8C8E93">&#160; brute-force attempt</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="0.9s" fill="freeze"/>
      </text>
      <text x="0" y="69" opacity="1">
        <tspan fill="#1F9D6B" font-weight="600">[OK]</tspan><tspan fill="#8C8E93">&#160; IP blocked via iptables</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.2s" fill="freeze"/>
      </text>
      <text x="0" y="92" opacity="1">
        <tspan fill="#1F9D6B" font-weight="600">[OK]</tspan><tspan fill="#8C8E93">&#160; RCON token validated</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.5s" fill="freeze"/>
      </text>
      <text x="0" y="115" opacity="1">
        <tspan fill="#1F9D6B" font-weight="600">[OK]</tspan><tspan fill="#8C8E93">&#160; systemd daemon isolated</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="1.8s" fill="freeze"/>
      </text>
      <text x="0" y="138" opacity="1">
        <tspan fill="#C3352B" font-weight="600">[CRT]</tspan><tspan fill="#8C8E93">&#160; cmd injection blocked</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.1s" fill="freeze"/>
      </text>
      <text x="0" y="161" opacity="1">
        <tspan fill="#1F9D6B" font-weight="600">[OK]</tspan><tspan fill="#8C8E93">&#160; SentinelSOC engine UP</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.4s" fill="freeze"/>
      </text>
      <text x="0" y="184" opacity="1">
        <tspan fill="#1F9D6B" font-weight="600">[OK]</tspan><tspan fill="#8C8E93">&#160; Bandit lvl 34 cleared</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="2.7s" fill="freeze"/>
      </text>
      <text x="0" y="207" opacity="1">
        <tspan fill="#F59E0B" font-weight="600">[WRN]</tspan><tspan fill="#8C8E93">&#160; privesc vector logged</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.0s" fill="freeze"/>
      </text>
    </g>

    <!-- Bottom Stat Box -->
    <g transform="translate(16,280)">
      <line x1="0" y1="0" x2="228" y2="0" stroke="rgba(237, 235, 230, 0.08)" stroke-width="1"/>
      <g transform="translate(0,18)">
        <text x="114" y="18" text-anchor="middle" fill="#1F9D6B" class="sans" font-size="28" font-weight="800">7</text>
        <text x="114" y="34" text-anchor="middle" fill="#8C8E93" class="mono" font-size="9.5" font-weight="600" letter-spacing="1.5">PROJECTS</text>
      </g>
    </g>
  </g>
</svg>