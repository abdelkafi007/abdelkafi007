      50% { opacity: 0.15; }
      100% { transform: translateY(390px); opacity: 0; }
    }
    .blinking { animation: blink 2s ease-in-out infinite; }
    .mono { font-family: 'IBM Plex Mono', 'JetBrains Mono', 'SF Mono', Consolas, Menlo, monospace; }
    .sans { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

